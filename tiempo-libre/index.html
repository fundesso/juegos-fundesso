<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tiempo libre · FUNDESSO</title><style>
:root{--blue:#168bd6;--deep:#145da8;--yellow:#ffc928;--green:#55c53d;--orange:#ff9d2e;--pink:#ff6f91;--ink:#17324d;--cream:#fffaf0}
*{box-sizing:border-box}body{margin:0;font-family:Trebuchet MS,Arial,sans-serif;background:linear-gradient(180deg,#79d8ff,#eafcff);color:var(--ink)}
button{font:inherit;cursor:pointer;border:0}.app{min-height:100vh;display:flex;flex-direction:column}
header{background:#fff;display:flex;align-items:center;justify-content:space-between;padding:12px 22px;box-shadow:0 3px 16px #2d6b8a30;position:sticky;top:0;z-index:5}
.brand{display:flex;gap:12px;align-items:center}.brand b{font-size:22px;color:#1264a5}.brand span{font-size:12px;color:#4f6b80}.logos{font-size:28px}
.score{background:#0e75c5;color:#fff;border-radius:30px;padding:9px 18px;font-weight:800}
main{width:min(1100px,94%);margin:18px auto 40px}.toprow{display:flex;gap:12px;align-items:center}
.progress{background:#ffffffcf;border:2px solid #fff;border-radius:18px;padding:10px 14px;box-shadow:0 5px 15px #31718c22;flex:1}.bar{height:12px;background:#d7edf7;border-radius:10px;overflow:hidden;margin-top:7px}.fill{height:100%;background:linear-gradient(90deg,#35c76b,#ffd238,#ff8b38);width:20%;transition:.4s}
.title{text-align:center;background:linear-gradient(135deg,#fff5c9,#fff);border-radius:30px;padding:15px;margin:15px 0 18px;box-shadow:0 10px 25px #31718c22;border:4px solid #fff}
h1{margin:0;color:#a95a16;font-size:clamp(30px,6vw,56px);text-shadow:0 3px #fff}.subtitle{font-size:18px;font-weight:800;color:#1269a6}
.card{background:#ffffffeb;border-radius:30px;padding:18px;box-shadow:0 14px 35px #2b688530;border:4px solid #fff}
.scene{display:grid;grid-template-columns:.9fr 1.1fr;gap:18px;align-items:center}.characters{display:flex;justify-content:center;align-items:flex-end;gap:8px;background:linear-gradient(135deg,#d9f7ff,#fff2c8);border-radius:24px;padding:10px;min-height:330px;overflow:hidden}
.char{width:32%;height:300px;object-fit:cover;border-radius:22px;box-shadow:0 8px 18px #315f7330;object-position:center top}
.story{font-size:21px;line-height:1.4;font-weight:700}.story strong{color:#0f72b8}.question{font-size:25px;margin:12px 0 10px;color:#8d4d0f}
.choices{display:grid;gap:12px}.choice{padding:15px 17px;border-radius:18px;text-align:left;background:#fff;border:3px solid #d6e8f2;box-shadow:0 5px 0 #c4dce8;font-weight:800;font-size:17px;transition:.15s}.choice:hover{transform:translateY(-2px);border-color:#42a9df}.choice.correct{background:#dcffd8;border-color:#42bd54;box-shadow:0 5px 0 #2e9b43}.choice.wrong{background:#ffe0e0;border-color:#ef7777;box-shadow:0 5px 0 #d75b5b}
.feedback{margin-top:15px;padding:14px 16px;border-radius:18px;background:#fff7c8;font-weight:800;display:none}.feedback.show{display:block}
.actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}.btn{padding:13px 20px;border-radius:18px;font-weight:900;background:#ffd037;color:#704600;box-shadow:0 5px 0 #e2aa13}.btn.primary{background:#178bd6;color:#fff;box-shadow:0 5px 0 #0b659e}.btn.home{background:#fff;color:#1269a6;border:2px solid #b9ddec;box-shadow:0 4px 0 #b9ddec}
.final{text-align:center;padding:24px}.stars{font-size:54px;letter-spacing:8px}.final h2{font-size:36px;color:#16804a}.badge{display:inline-block;background:#ffe169;padding:9px 15px;border-radius:30px;font-weight:900;margin:8px}
footer{text-align:center;padding:20px;color:#426477;font-size:13px}@media(max-width:760px){header{padding:10px 12px}.brand b{font-size:17px}.brand span{display:none}.scene{grid-template-columns:1fr}.characters{min-height:230px}.char{height:220px}.story{font-size:18px}.question{font-size:21px}}
</style></head><body><div class="app">
<header><div class="brand"><div class="logos">🌈⭐</div><div><b>FUNDESSO</b><br><span>Educación · Protección · Futuro</span></div></div><div class="score">⭐ <span id="score">0</span> puntos</div></header>
<main><div class="toprow"><div class="progress"><b id="progressText">Situación 1 de 5</b><div class="bar"><div id="fill" class="fill"></div></div></div><button class="btn home" onclick="goHome()">🏠 Portal</button></div>
<div class="title"><h1>Tiempo libre</h1><div class="subtitle">Jugar, crear, descansar y compartir también es aprender 🌈</div></div><div class="card" id="game"></div></main>
<footer>FUNDESSO · Fundación para el Desarrollo Social Sostenible · Alcaldía de Soledad</footer></div>
<script>
const scenes=[{"story": "Después de clases tienes varias opciones: descansar, jugar, ayudar en casa, leer o hacer una actividad que disfrutas.", "q": "¿Cuál es una buena forma de organizar tu tiempo libre?", "opts": ["Combinar descanso, juego y actividades que te hagan bien.", "Pasar todo el tiempo frente a una pantalla.", "No dejar ningún momento para descansar."], "correct": 0, "good": "¡Muy bien! El tiempo libre puede incluir descanso, juego, creatividad y movimiento.", "tip": "Buscar un equilibrio hace que tu tiempo libre sea más saludable."}, {"story": "Tus amigos quieren quedarse sentados toda la tarde, pero tú quieres moverte un poco.", "q": "¿Qué podrías proponer?", "opts": ["Hacer una actividad física divertida entre todos.", "Discutir porque deben hacer lo que tú dices.", "No volver a compartir con ellos."], "correct": 0, "good": "¡Excelente! Caminar, bailar, jugar o practicar un deporte puede ser una gran opción.", "tip": "Mover el cuerpo también puede ser divertido cuando se hace en compañía."}, {"story": "Tienes una tarde tranquila y quieres usarla para crear algo nuevo.", "q": "¿Qué actividad aprovecha bien el tiempo libre?", "opts": ["Leer, dibujar, escribir, hacer música o aprender algo nuevo.", "Esperar sin hacer nada durante toda la tarde.", "Dejar de hacer cualquier actividad que te guste."], "correct": 0, "good": "¡Genial! La creatividad y el aprendizaje también pueden ser parte del tiempo libre.", "tip": "Explorar nuevos intereses puede ayudarte a descubrir lo que disfrutas."}, {"story": "Un amigo te invita a jugar, pero otra compañera está sola y podría participar.", "q": "¿Qué opción demuestra compartir el tiempo libre con buen trato?", "opts": ["Invitarla a participar y buscar un juego para todos.", "Decirle que no puede jugar.", "Ignorarla para que no interrumpa."], "correct": 0, "good": "¡Muy bien! Compartir e incluir hace que el tiempo libre sea más divertido para todos.", "tip": "Una invitación puede hacer que otra persona se sienta bienvenida."}, {"story": "Llevas un rato usando una pantalla y notas que estás cansado.", "q": "¿Qué decisión muestra equilibrio?", "opts": ["Seguir hasta que termine el día.", "Hacer una pausa y combinar la pantalla con otra actividad.", "Evitar dormir para tener más tiempo libre."], "correct": 1, "good": "¡Correcto! Hacer pausas y combinar actividades ayuda a disfrutar mejor el tiempo libre.", "tip": "También puedes descansar, conversar, moverte o hacer algo creativo."}];
let i=0,score=0,answered=false;
const icons=['🌱','💙','⭐'];
function render(){const s=scenes[i];answered=false;document.getElementById('progressText').textContent=`Situación ${i+1} de ${scenes.length}`;document.getElementById('fill').style.width=((i+1)/scenes.length*100)+'%';
const art=`<div class="characters"><img class="char" src="personaje-1.png" alt="Personaje de FUNDESSO"><img class="char" src="personaje-2.png" alt="Personaje de FUNDESSO"><img class="char" src="personaje-3.png" alt="Personaje de FUNDESSO"></div>`;
document.getElementById('game').innerHTML=`<div class="scene">${art}<div><div class="story">${s.story}</div><div class="question">${s.q}</div><div class="choices">${s.opts.map((o,n)=>`<button class="choice" onclick="choose(${n},this)">${icons[n]} ${o}</button>`).join('')}</div><div id="feedback" class="feedback"></div></div></div><div class="actions"><button class="btn" onclick="goHome()">⬅️ Volver al portal</button><button id="next" class="btn primary" style="display:none" onclick="next()">Siguiente ➜</button></div>`}
function choose(n,el){if(answered)return;answered=true;const s=scenes[i];const buttons=[...document.querySelectorAll('.choice')];buttons.forEach(b=>b.disabled=true);
if(n===s.correct){score+=20;el.classList.add('correct');showFeedback(s.good,'#dcffd8')}else{el.classList.add('wrong');buttons[s.correct].classList.add('correct');showFeedback('Casi. '+s.tip,'#ffe9c2')}
document.getElementById('score').textContent=score;document.getElementById('next').style.display='inline-block';}
function showFeedback(txt,bg){const f=document.getElementById('feedback');f.textContent=txt;f.style.background=bg;f.classList.add('show')}
function next(){if(i<scenes.length-1){i++;render()}else finish()}
function finish(){const stars=score>=80?'⭐⭐⭐':score>=60?'⭐⭐':'⭐';document.getElementById('game').innerHTML=`<div class="final"><div class="stars">${stars}</div><h2>¡Juego completado!</h2><p style="font-size:22px;font-weight:800">Tu puntuación: ${score} / 100</p><span class="badge">💛 ¡Gran aprendizaje!</span><p style="font-size:19px;font-weight:700">Cada buena decisión ayuda a construir una infancia con derechos, respeto y oportunidades.</p><div class="actions" style="justify-content:center"><button class="btn home" onclick="goHome()">🏠 Volver al portal</button><button class="btn primary" onclick="i=0;score=0;document.getElementById('score').textContent=0;render()">🔄 Jugar otra vez</button></div></div>`}
function goHome(){window.location.href='../'}render();
</script></body></html>
